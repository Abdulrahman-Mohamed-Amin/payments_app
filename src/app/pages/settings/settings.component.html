<main class="flex-1 px-5 lg:px-8 py-6 space-y-6 max-w-3xl">

  <!-- Profile -->
  <section class="rounded-2xl bg-white border border-line shadow-card p-5 lg:p-6">
    <div class="flex items-center gap-3 mb-5">
      <div class="grid h-11 w-11 place-items-center rounded-xl bg-brand-50 text-brand-700"><app-icon name="users" /></div>
      <div>
        <h2 class="font-bold">الملف الشخصي</h2>
        <p class="text-xs text-ink-muted">معلومات الحساب الأساسية</p>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <label class="block">
        <span class="text-xs font-semibold text-ink-muted">الاسم</span>
        <input [(ngModel)]="name" class="mt-1.5 w-full rounded-xl border border-line bg-canvas px-3 py-2.5 text-sm focus:outline-none focus:border-brand-300 focus:ring-2 focus:ring-brand-100" />
      </label>
      <label class="block">
        <span class="text-xs font-semibold text-ink-muted">المسمى الوظيفي</span>
        <input [(ngModel)]="role" class="mt-1.5 w-full rounded-xl border border-line bg-canvas px-3 py-2.5 text-sm focus:outline-none focus:border-brand-300 focus:ring-2 focus:ring-brand-100" />
      </label>
      <label class="block">
        <span class="text-xs font-semibold text-ink-muted">الشركة</span>
        <input [(ngModel)]="company" class="mt-1.5 w-full rounded-xl border border-line bg-canvas px-3 py-2.5 text-sm focus:outline-none focus:border-brand-300 focus:ring-2 focus:ring-brand-100" />
      </label>
      <label class="block">
        <span class="text-xs font-semibold text-ink-muted">البريد الإلكتروني</span>
        <input [value]="email" type="email" dir="ltr" readonly
          class="mt-1.5 w-full rounded-xl border border-line bg-canvas px-3 py-2.5 text-sm text-left opacity-60 cursor-not-allowed" />
      </label>
    </div>
  </section>

  <!-- Notifications -->
  <section class="rounded-2xl bg-white border border-line shadow-card p-5 lg:p-6">
    <div class="flex items-center gap-3 mb-5">
      <div class="grid h-11 w-11 place-items-center rounded-xl bg-[#FFF4E3] text-[#C77A12]"><app-icon name="bell" /></div>
      <div>
        <h2 class="font-bold">التنبيهات</h2>
        <p class="text-xs text-ink-muted">تحكّم في إشعارات الدفعات والعقود</p>
      </div>
    </div>

    <!-- Notification email -->
    <div class="mb-5 rounded-xl border border-brand-100 bg-brand-50 p-4">
      <label class="block">
        <span class="text-xs font-semibold text-brand-700 flex items-center gap-1.5 mb-1.5">
          <app-icon name="bell" cls="h-3.5 w-3.5" />
          إيميل استلام الإشعارات اليومية
        </span>
        <input [(ngModel)]="notificationEmail" type="email" dir="ltr" placeholder="example@email.com"
          class="w-full rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm text-left focus:outline-none focus:border-brand transition" />
        <p class="text-[11px] text-brand-700 mt-1.5">يُبعَت إيميل يومياً الساعة 11 ص (توقيت الرياض) يحتوي على كل الدفعات المتأخرة</p>
      </label>
    </div>

    <div class="divide-y divide-line">
      <label class="flex items-center justify-between py-3 cursor-pointer">
        <div>
          <p class="text-sm">تنبيه عند تأخّر دفعة</p>
          <p class="text-xs text-ink-muted mt-0.5">إشعار فوري عند حلول موعد الدفعة دون سداد</p>
        </div>
        <input type="checkbox" [(ngModel)]="notifyOverdue" class="peer sr-only" />
        <span class="relative h-6 w-11 shrink-0 mr-4 rounded-full bg-line transition peer-checked:bg-brand after:absolute after:top-0.5 after:right-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:after:-translate-x-5"></span>
      </label>
      <label class="flex items-center justify-between py-3 cursor-pointer">
        <div>
          <p class="text-sm">تنبيه عند إنشاء عقد جديد</p>
          <p class="text-xs text-ink-muted mt-0.5">إشعار عند حفظ عقد جديد في النظام</p>
        </div>
        <input type="checkbox" [(ngModel)]="notifyNewContract" class="peer sr-only" />
        <span class="relative h-6 w-11 shrink-0 mr-4 rounded-full bg-line transition peer-checked:bg-brand after:absolute after:top-0.5 after:right-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:after:-translate-x-5"></span>
      </label>
      <label class="flex items-center justify-between py-3 cursor-pointer">
        <div>
          <p class="text-sm">تذكير قبل موعد الدفعة</p>
          <p class="text-xs text-ink-muted mt-0.5">تنبيه قبل 3 أيام من تاريخ الاستحقاق</p>
        </div>
        <input type="checkbox" [(ngModel)]="notifyPaymentDue" class="peer sr-only" />
        <span class="relative h-6 w-11 shrink-0 mr-4 rounded-full bg-line transition peer-checked:bg-brand after:absolute after:top-0.5 after:right-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:after:-translate-x-5"></span>
      </label>
    </div>
  </section>

  <!-- Preferences -->
  <section class="rounded-2xl bg-white border border-line shadow-card p-5 lg:p-6">
    <div class="flex items-center gap-3 mb-5">
      <div class="grid h-11 w-11 place-items-center rounded-xl bg-brand-50 text-brand-700"><app-icon name="gear" /></div>
      <div>
        <h2 class="font-bold">التفضيلات</h2>
        <p class="text-xs text-ink-muted">اللغة والعملة الافتراضية</p>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <label class="block">
        <span class="text-xs font-semibold text-ink-muted">اللغة</span>
        <select class="mt-1.5 w-full rounded-xl border border-line bg-canvas px-3 py-2.5 text-sm focus:outline-none focus:border-brand-300 focus:ring-2 focus:ring-brand-100">
          <option selected>العربية</option>
        </select>
      </label>
      <label class="block">
        <span class="text-xs font-semibold text-ink-muted">العملة</span>
        <select [(ngModel)]="currency" class="mt-1.5 w-full rounded-xl border border-line bg-canvas px-3 py-2.5 text-sm focus:outline-none focus:border-brand-300 focus:ring-2 focus:ring-brand-100">
          <option value="SAR">ريال سعودي (ر.س)</option>
        </select>
      </label>
    </div>
  </section>

  <!-- Account -->
  <section class="rounded-2xl bg-white border border-line shadow-card p-5 lg:p-6">
    <div class="flex items-center gap-3 mb-5">
      <div class="grid h-11 w-11 place-items-center rounded-xl bg-[#FEF2F2] text-[#DC2626]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </div>
      <div>
        <h2 class="font-bold">الحساب</h2>
        <p class="text-xs text-ink-muted">إجراءات الحساب</p>
      </div>
    </div>
    <button (click)="auth.signOut()"
      class="flex items-center gap-2 rounded-xl border border-[#FCA5A5] bg-[#FEF2F2] px-5 py-2.5 text-sm font-semibold text-[#DC2626] hover:bg-[#FEE2E2] transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      تسجيل الخروج
    </button>
  </section>

  <!-- Error -->
  @if (errorMsg) {
    <div class="flex items-center gap-2 rounded-xl border border-[#FCA5A5] bg-[#FEF2F2] px-4 py-3">
      <app-icon name="alert" cls="h-4 w-4 text-[#DC2626] shrink-0" />
      <p class="text-sm text-[#DC2626]">{{ errorMsg }}</p>
    </div>
  }

  <!-- Save -->
  <div class="flex items-center gap-3">
    <button (click)="save()" [disabled]="saving"
      class="flex items-center gap-2 rounded-xl py-2.5 px-6 text-sm font-semibold text-white transition disabled:opacity-60"
      [class.bg-brand]="!saved"
      [class.hover:bg-brand-600]="!saved"
      [class.bg-[#16A34A]]="saved">
      @if (saving) {
        <span class="h-4 w-4 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
        جاري الحفظ…
      } @else if (saved) {
        <app-icon name="check" cls="h-4 w-4" /> تم الحفظ
      } @else {
        حفظ التغييرات
      }
    </button>
    <button (click)="ngOnInit()" [disabled]="saving"
      class="rounded-xl border border-line py-2.5 px-6 text-sm font-semibold text-ink-muted hover:bg-canvas transition disabled:opacity-60">
      إلغاء
    </button>
  </div>

</main>
